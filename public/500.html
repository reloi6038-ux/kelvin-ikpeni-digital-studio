<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Server Error | Kelvin Ikpeni</title>
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <main id="main-content" style="display:grid; place-items:center; min-height:100vh; text-align:center; padding:2rem;">
    <div class="reveal is-visible" style="max-width: 500px;">
      <h1 style="font-size:clamp(5rem, 10vw, 8rem); line-height:1; margin-bottom:1rem;" class="text-gradient">500</h1>
      <h2 style="margin-bottom:1rem; font-size: 2rem;">Internal Server Error</h2>
      <p style="color:var(--text-secondary); margin-bottom:2.5rem; font-size: 1.1rem;">
        Something went wrong on my end. I've been notified and will look into it. Please try refreshing the page or returning home.
      </p>
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <button onclick="window.location.reload()" class="btn btn-secondary">Refresh Page</button>
        <a href="/" class="btn btn-primary">Return Home</a>
      </div>
    </div>
  </main>
</body>
</html>
