<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Register | Kelvin Ikpeni</title>
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-base); margin: 0; }
    .login-box { background: var(--bg-card); padding: 3rem; border-radius: var(--radius-lg); width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.05); }
    .form-group { margin-bottom: 1.5rem; }
    input { width: 100%; padding: 1rem; background: var(--bg-surface); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--text-primary); outline: none; }
    input:focus { border-color: var(--accent-cyan); }
    #error-msg { color: #f87171; font-size: 0.9rem; margin-bottom: 1rem; display: none; text-align: center; padding: 0.5rem; background: rgba(239, 68, 68, 0.1); border-radius: 8px; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2 style="text-align: center; margin-bottom: 2rem; color: var(--text-primary);">Create Admin Account</h2>
    <div id="error-msg"></div>
    <form id="register-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password (min 8 chars)</label>
        <input type="password" id="password" required autocomplete="new-password" />
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Register</button>
      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="/admin/login.html" style="color: var(--text-secondary); font-size: 0.9rem; text-decoration: none;">Already have an account? Log in</a>
      </div>
    </form>
  </div>

  <script src="/js/admin-register.js"></script>
</body>
</html>
